name: Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

jobs:
  db-push:
    name: Push database migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use the CLI pinned in package-lock.json instead of asking GitHub's API
      # for the latest release. This keeps deployments reproducible and avoids
      # rate-limit failures from supabase/setup-cli.
      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing GitHub secret: SUPABASE_PROJECT_REF"
            echo "Use the Supabase project ref, not the project name. It looks like abcdefghijklmnopqrst."
            exit 1
          fi

      - name: Link Supabase project
        run: ./node_modules/.bin/supabase link --project-ref "$SUPABASE_PROJECT_REF" --debug

      - name: Push migrations
        run: ./node_modules/.bin/supabase db push
